[package]
name = "fastmail-cli"
version = "3.5.0"
edition = "2024"
description = "CLI for Fastmail's JMAP API"
repository = "https://github.com/radiosilence/fastmail-cli"
license = "MIT"
keywords = ["cli", "email", "fastmail", "jmap"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "fastmail"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
askama = "0.16"
async-graphql = { version = "7", features = ["dataloader"] }
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
dirs = "6.0.0"
http = "1"
image = {
  version = "0.25",
  default-features = false,
  features = ["gif", "jpeg", "png", "webp"]
}
kreuzberg = {
  version = "~4.8",
  features = [
    "archives",
    "bundled-pdfium",
    "email",
    "excel",
    "html",
    "language-detection",
    "office",
    "pdf",
    "xml"
  ]
}
open = "5"
percent-encoding = "2"
reqwest = {
  version = "0.13.1",
  default-features = false,
  features = ["json", "rustls"]
}
rmcp = {
  version = "1",
  features = ["server", "transport-io", "transport-streamable-http-server"]
}
roxmltree = "0.21.1"
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
# `test-util` for the paused clock, so backoff tests assert timing without waiting it out.
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
