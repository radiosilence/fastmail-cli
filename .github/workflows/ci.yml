name: CI/CD

# Doc-only changes don't need the build/test/release pipeline — skip it when a
# push/PR touches nothing but Markdown or the licence. The changelog is
# Markdown too, but its fragments are checked here, so they still trigger it.
on:
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "!LICENSE", "changelog.d/**", "CHANGELOG.md"]
  pull_request:
    branches: [main]
    paths: ["**", "!**/*.md", "!LICENSE", "changelog.d/**", "CHANGELOG.md"]
  # GitHub evicts any cache not read for 7 days, and this repo goes quiet for
  # longer than that between bursts of work. The first push back then compiles
  # ~200 crates from cold on every runner, which is the slow build people
  # actually notice. Building twice a week on main keeps the entries alive and
  # re-saves them against the current Cargo.lock, so the cost lands on a
  # schedule rather than on whoever opens the next pull request.
  schedule:
    - cron: "0 6 * * 1,4"
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled, since any of them may be publishing a release, and a manual run
# is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # radiosilence/fastmail-cli

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt -- --check
      # --all-targets so the tests are linted too, which the bare invocation
      # skipped. No separate `cargo build`: `cargo test` compiles the binary as
      # well, so it only bought a second pass over the same crates.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # A push releases only when it changes the version. Comparing with the latest
  # GitHub release alone would let a push that lands while a release is still
  # running (the release appears at its end) release the same version a second
  # time. A manual run releases whatever is unreleased, which is how a failed
  # release is retried. Releases rather than tags are the record of what has
  # shipped, since consumers and update pollers read them.
  version:
    name: Version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          VERSION=$(version_of < Cargo.toml)
          PREVIOUS=$(git show HEAD^:Cargo.toml 2>/dev/null | version_of || true)
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ "$VERSION" = "${LATEST#v}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$VERSION" != "$PREVIOUS" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml $VERSION (was ${PREVIOUS:-none}), latest release ${LATEST:-none}"

  # One job, one compile, two outputs: this owns the Linux release build and
  # feeds the same binary straight into the Docker build. Splitting them would
  # cost a runner handoff and an artifact round-trip, and upload-artifact drops
  # the executable bit on the way through.
  #
  # Runs on pull requests: nothing else builds the image, so a broken Dockerfile
  # used to surface only after merge. Pushes nothing either way.
  #
  # The runner is pinned rather than ubuntu-latest, and that is load-bearing:
  # this binary is copied into a distroless image, and glibc symbol versioning
  # is forward-compatible only, so building against a newer glibc than the base
  # links fine and dies at exec time. cc-debian13 is 2.41, which makes 24.04
  # (2.39) the newest usable runner — 25.10 is 2.42 and 26.04 is 2.43. A
  # floating ubuntu-latest would break the image the day it rolls over.
  build-image:
    name: Build ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runner }}
    strategy:
      # A transient failure on one arch shouldn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            name: linux-x86_64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: linux-aarch64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake pkg-config
      - name: Build
        run: cargo build --release --locked
      - name: Stage binary
        run: mkdir -p dist && cp target/release/fastmail dist/fastmail
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # No gha layer cache: nothing compiles in the image now, and mode=max was
      # stuffing Rust build layers into the same repo-wide 10GB budget
      # Swatinem/rust-cache uses, so the two evicted each other.
      - name: Build ${{ matrix.arch }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: BIN_SOURCE=prebuilt
          # Baked into the tarball, so publish pushes what it loads untouched.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
      - name: Smoke test
        run: |
          docker load -i /tmp/image-${{ matrix.arch }}.tar
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }} --version
      - name: Package binary
        run: tar -czvf fastmail-cli-${{ matrix.name }}.tar.gz -C dist fastmail
      # A scheduled run compiles only to refresh the cache, so it has no reason
      # to leave a 90-day artefact behind twice a week.
      - name: Upload binary
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.name }}
          path: fastmail-cli-${{ matrix.name }}.tar.gz
      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          # Only publish reads these, minutes later.
          retention-days: 1

  # Release assets only — no image consumes these, so they'd be dead weight on a
  # pull request. Runs on the schedule regardless, because these are the only
  # macOS caches in the pipeline and they are wanted warm precisely when a
  # release goes out, which is rare enough that they would otherwise always have
  # expired by then.
  build-darwin:
    name: Build ${{ matrix.name }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: darwin-x86_64
          - target: aarch64-apple-darwin
            name: darwin-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Developer ID signed and notarised, so the tarball runs from a browser
      # download without clearing quarantine. Pull requests stay ad-hoc signed.
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && github.event_name != 'schedule'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/${{ matrix.target }}/release/fastmail
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Package
        run: tar -czvf fastmail-cli-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release fastmail
      - name: Upload binary
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.name }}
          path: fastmail-cli-${{ matrix.name }}.tar.gz

  # The only job that publishes anything, and the release is its last step. This
  # project is consumed as a container, so a version tag with no image behind it
  # is worse than no tag at all — an auto-updater polling releases will happily
  # pin one. Images go up first; the release announces them.
  publish:
    name: Publish
    needs: [check, changelog, version, build-image, build-darwin]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      # Before anything is pushed: the release is created with RELEASE_TOKEN,
      # and semver image tags with no release behind them would wait for a
      # manual retry.
      - name: Check the release token
        if: needs.version.outputs.should_release == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be created"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Loading an arm64 image on an amd64 runner is fine — it is stored and
      # pushed here, never executed.
      - name: Push arch images
        run: |
          for arch in amd64 arm64; do
            docker load -i /tmp/images/image-$arch.tar
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-$arch
          done
      - name: Create :main and :sha-<short> manifests
        run: |
          for tag in main "sha-$(echo ${{ github.sha }} | cut -c1-7)"; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done
      - name: Create semver manifests
        if: needs.version.outputs.should_release == 'true'
        run: |
          VERSION=${{ needs.version.outputs.version }}
          for tag in "v$VERSION" "v$(echo $VERSION | cut -d. -f1,2)" "v$(echo $VERSION | cut -d. -f1)" latest; do
            docker buildx imagetools create \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.version.outputs.should_release == 'true'
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.version.outputs.should_release == 'true'
        with:
          path: src
      - name: Release notes
        if: needs.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' src/CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      # The action creates the tag through the API, on the commit that was
      # built: GitHub refuses a git push of it from the workflow token for any
      # commit that changes a workflow. A re-run finds the release and tag and
      # fills in what is missing.
      - name: Create Release
        if: needs.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: artifacts/*.tar.gz
