name: CI/CD

# The pipeline itself lives in .dagger — this file only decides when to run it
# and what credentials to hand it. Doc-only changes don't need any of it, so
# skip when a push/PR touches nothing but Markdown or the licence.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]

env:
  # Keep in step with engineVersion in dagger.json.
  DAGGER_VERSION: 0.21.7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs every function annotated +check — fmt, clippy, test — and reports
      # them individually rather than as one opaque script.
      - uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: check
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: true

  darwin:
    name: Build ${{ matrix.name }}
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The one piece Dagger can't take: aws-lc-sys, via rustls, does not
    # cross-compile to darwin from a Linux container. Built natively here and
    # handed to the release step as an artifact.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: darwin-x86_64
          - target: aarch64-apple-darwin
            name: darwin-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar -czf fastmail-cli-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release fastmail
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastmail-cli-${{ matrix.name }}
          path: fastmail-cli-${{ matrix.name }}.tar.gz

  deliver:
    name: Publish images and release
    needs: [check, darwin]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # push to ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: darwin
          merge-multiple: true
      - uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: ${{ env.DAGGER_VERSION }}
          call: >-
            deliver
            --repo=${{ github.repository }}
            --image=ghcr.io/${{ github.repository }}
            --commit=${{ github.sha }}
            --registry-username=${{ github.actor }}
            --registry-password=env://GITHUB_TOKEN
            --github-token=env://GITHUB_TOKEN
            --darwin-assets=./darwin
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
